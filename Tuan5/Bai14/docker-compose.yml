services:
  service1:
    image: alpine
    networks:
      - private_net
    command: ["sh", "-c", "while true; do ping -c 1 service2; sleep 10; done"]

  service2:
    image: alpine
    networks:
      - private_net
    command: ["sh", "-c", "while true; do sleep 3600; done"]

networks:
  private_net:
    driver: bridge
    internal: true # Đây là mạng riêng, không thể truy cập từ bên ngoài
