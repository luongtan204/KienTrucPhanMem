services:
  rabbitmq:
    image: rabbitmq:4.2.3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"

  spring-producer:
    build: ./spring-producer
    container_name: spring-producer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: user
      RABBITMQ_PASS: password
      ORDER_QUEUE: order_queue
      ORDER_QUEUE_DLQ: order_queue.dlq
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq

  spring-consumer:
    build: ./spring-consumer
    container_name: spring-consumer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: user
      RABBITMQ_PASS: password
      ORDER_QUEUE: order_queue
      ORDER_QUEUE_DLQ: order_queue.dlq
    depends_on:
      - rabbitmq
